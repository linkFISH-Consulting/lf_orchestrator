name: Verify changelog updated

# pull_request_target allows reminders on forked PRs. This workflow does not
# check out or execute code from the PR; it only reads PR file metadata and posts
# a comment through the GitHub API.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files and remind about the changelog
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });

            // Include TOML so a pyproject.toml version bump also gets a reminder.
            const hasRelevantChanges = files.some(({ filename }) =>
              /\.(py|sql|yml|yaml|sh|md|toml)$/i.test(filename)
            );
            const hasChangelogUpdate = files.some(
              ({ filename }) => filename === "CHANGELOG.md"
            );
            if (!hasRelevantChanges || hasChangelogUpdate) return;

            const marker = "<!-- changelog-reminder -->";
            const body = `${marker}\nThank you for the PR! The changelog has not been updated, so here is a friendly reminder to check if you need to add an entry.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
